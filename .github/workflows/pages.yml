# SPDX-License-Identifier: Apache-2.0
name: pages
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
permissions:
  pages: write
  id-token: write
  actions: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: site
          path: site
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: stale gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          triggered="${{ github.event.workflow_run.head_sha }}"
          main_head=$(gh api "repos/${{ github.repository }}/commits/main" --jq .sha)
          if [ "$triggered" != "$main_head" ]; then
            echo "stale artifact: triggered=$triggered main=$main_head"
            exit 1
          fi
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: site/text-to-sql-guardrails
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
      - name: smoke
        run: |
          set -euo pipefail
          url="${{ steps.deploy.outputs.page_url }}"
          code=$(curl -s -o page.html -w '%{http_code}' "$url")
          test "$code" = "200"
          grep -q 'demo, deterministic offline model, not a production security boundary' page.html
          title=$(grep -o '<title>[^<]*</title>' page.html | head -n1)
          echo "$title" | grep -q 'demo, deterministic offline model, not a production security boundary'
          for rel in pyodide/pyodide.js app.js python/guard.py precomputed.json; do
            sub=$(curl -s -o /dev/null -w '%{http_code}' "${url%/}/$rel")
            test "$sub" = "200"
          done
