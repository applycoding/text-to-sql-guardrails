# SPDX-License-Identifier: Apache-2.0
name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt
      - run: pip install -e .
      - run: ruff check src tests tools e2e .github
      - run: ruff format --check src tests tools e2e .github
      - run: mypy --strict src
      - run: python tools/check_notice.py
      - name: SPDX headers
        run: |
          missing=0
          while IFS= read -r f; do
            head -n1 "$f" | grep -q 'SPDX-License-Identifier: Apache-2.0' || { echo "missing SPDX: $f"; missing=1; }
          done < <(git ls-files '*.py' '*.js' '*.sql' '*.yml' '*.html')
          exit $missing
      - name: LICENSE sha256
        run: |
          curl -fsSL https://www.apache.org/licenses/LICENSE-2.0.txt -o /tmp/apache.txt
          echo 'cfc7749b96f63bd31c3c42b5c471bf756814053e847c10f3eb003417bc523d30  /tmp/apache.txt' | sha256sum -c -
          sha256sum LICENSE | awk '{print $1}' > /tmp/local.sha
          sha256sum /tmp/apache.txt | awk '{print $1}' > /tmp/upstream.sha
          diff /tmp/local.sha /tmp/upstream.sha
      - name: action pin check
        run: |
          if grep -E 'uses:.*@[^0-9a-f]{40}' .github/workflows/*.yml; then
            echo 'unpinned action ref'
            exit 1
          fi
      - name: forbid tautology tests
        run: |
          ! rg -n 'assert True|pytest\.skip|xfail' tests/
      - name: no API key in workflow
        run: '! rg -n T2SQL_LLM_API_KEY .github/workflows/ci.yml'
      - name: README required sections
        run: |
          grep -q 'demo, deterministic offline model, not a production security boundary' README.md
          grep -q '### Honest limits' README.md
          grep -q '### How this was verified' README.md
          grep -q 'REFERENCES.md' README.md
          grep -q 'untested in CI' README.md
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11@sha256:ff87138949ad9a46f32ff23bd6852b52ce024a13dffe9b4087be98292cdd3b4f
        env:
          POSTGRES_PASSWORD: ci_admin
          POSTGRES_INITDB_ARGS: --locale=C --encoding=UTF8
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      T2SQL_DSN_HOST: postgres
      T2SQL_DSN_PORT: 5432
      T2SQL_DSN_DATABASE: postgres
      T2SQL_DSN_ADMIN_PASSWORD: ci_admin
      T2SQL_READER_PASSWORD: ci_reader
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt
      - run: pip install -e .
      - run: python -m t2sql.seed
      - run: python -c "import pg8000.native as p; print(p.Connection(host='postgres', user='postgres', password='ci_admin').run('SELECT version()'))"
      - run: pytest -p no:cacheprovider -rA
  mutants:
    needs: test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11@sha256:ff87138949ad9a46f32ff23bd6852b52ce024a13dffe9b4087be98292cdd3b4f
        env:
          POSTGRES_PASSWORD: ci_admin
          POSTGRES_INITDB_ARGS: --locale=C --encoding=UTF8
    env:
      T2SQL_DSN_HOST: postgres
      T2SQL_DSN_PORT: 5432
      T2SQL_DSN_DATABASE: postgres
      T2SQL_DSN_ADMIN_PASSWORD: ci_admin
      T2SQL_READER_PASSWORD: ci_reader
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt
      - run: pip install -e .
      - run: python -m t2sql.seed
      - run: python tools/mutants.py
  site:
    needs: test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11@sha256:ff87138949ad9a46f32ff23bd6852b52ce024a13dffe9b4087be98292cdd3b4f
        env:
          POSTGRES_PASSWORD: ci_admin
          POSTGRES_INITDB_ARGS: --locale=C --encoding=UTF8
    env:
      T2SQL_DSN_HOST: postgres
      T2SQL_DSN_PORT: 5432
      T2SQL_DSN_DATABASE: postgres
      T2SQL_DSN_ADMIN_PASSWORD: ci_admin
      T2SQL_READER_PASSWORD: ci_reader
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt
      - run: pip install -e .
      - run: python -m t2sql.seed
      - run: playwright install --with-deps chromium
      - run: python tools/build_site.py
      - run: pytest -p no:cacheprovider e2e/test_site.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: site
          path: site-dist/
